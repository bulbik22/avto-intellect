server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/api/v1/assessments(/|$) {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $estimate_backend estimate:8000;
        proxy_pass http://$estimate_backend;
    }

    location /api/v1/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $users_backend users:8000;
        proxy_pass http://$users_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
