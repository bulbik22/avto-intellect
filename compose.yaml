services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avto_intellect}
      POSTGRES_USER: ${POSTGRES_USER:-avto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  users:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-avto_intellect}
      PGUSER: ${POSTGRES_USER:-avto}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HTTPS_ONLY: ${HTTPS_ONLY:-0}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
    volumes:
      - ./frontend:/app/frontend:ro

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - users
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
