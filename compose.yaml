services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avto_intellect}
      POSTGRES_USER: ${POSTGRES_USER:-avto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.28
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  users:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@avto-intellect.local}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      DATABASE_URL: postgresql+psycopg://
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-avto_intellect}
      PGUSER: ${POSTGRES_USER:-avto}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HTTPS_ONLY: ${HTTPS_ONLY:-0}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
    volumes:
      - ./frontend:/app/frontend:ro

  minio:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-avto}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio_data:/bitnami/minio/data

  estimate:
    build: ./backend
    command: ["sh", "-c", "alembic -n estimate upgrade head && exec uvicorn services.estimate.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      users:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-avto_intellect}
      PGUSER: ${POSTGRES_USER:-avto}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      USERS_URL: http://users:8000
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-avto}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - users
      - estimate
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  minio_data:
