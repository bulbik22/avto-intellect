<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f9fc">
    <title>Регистрация</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container registration">
        <header class="registration__header">
            <p class="registration__title title">Авто-интеллект</p>
        </header>
        <main class="registration__content">
            <h1 class="registration__inscription title title--large">Регистрация</h1>
            <form class="registration__form" action="#" method="POST">
                <div class="registration__fields">
                    <div class="field">
                        <label class="field__label" for="email">Email</label>
                        <input class="field__input" type="email" id="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label class="field__label" for="password">Пароль</label>
                        <input class="field__input" type="password" id="password" name="password" autocomplete="new-password" required>
                    </div>
                </div>
                <button class="registration__submit btn btn--light btn--medium" type="submit">Отправить код &gt;</button>
            </form>
            <div class="registration__login">
                <p class="registration__login-text">Уже есть аккаунт? -</p>
                <a class="registration__login-button btn btn--accent btn--medium" href="login.html">Войти</a>
            </div>
        </main>
    </div>
</body>
</html>
