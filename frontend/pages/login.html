<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f9fc">
    <title>Вход</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container login">
        <header class="login__header">
            <p class="login__title title">Авто-интеллект</p>
        </header>
        <main class="login__content">
            <h1 class="login__inscription title title--large">Вход</h1>
            <form class="login__form" action="#" method="POST">
                <div class="login__fields">
                    <div class="field">
                        <label class="field__label" for="email">Email</label>
                        <input class="field__input" type="email" id="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label class="field__label" for="password">Пароль</label>
                        <input class="field__input" type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>
                </div>
                <a class="login__forgot" href="recovery.html">Забыл пароль? - получить код восстановления</a>
                <button class="login__submit btn btn--light btn--large" type="submit">Войти</button>
            </form>
            <div class="login__registration">
                <p class="login__registration-text">Нет аккаунта? - зарегистрируйтесь</p>
                <a class="login__registration-button btn btn--accent btn--medium" href="registration.html">Зарегистрироваться</a>
            </div>
        </main>
    </div>
    <script type="module" src="../js/account.js"></script>
</body>
</html>
