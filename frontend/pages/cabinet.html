<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f9fc">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <main class="card cabinet">
            <p class="cabinet__brand">Авто-интеллект</p>
            <p class="cabinet__subtitle">Умный помощник</p>
            <h1 class="cabinet__title">Личный кабинет</h1>

            <div class="field field--sm cabinet__field">
                <span class="field__label" id="email-label">Email</span>
                <output class="output output--line output--value cabinet__value" aria-labelledby="email-label"></output>
            </div>

            <h2 class="cabinet__heading" id="saved-title">Мои автомобили</h2>
            <section class="saved" aria-labelledby="saved-title">
                <!-- Документы и черновики подставляет сервер или JS. data-id — идентификатор для запроса на удаление -->
                <ul class="saved__list" id="saved-list"></ul>
                <p class="saved__empty" id="saved-empty" hidden>Пока здесь ничего нет</p>
                <a class="saved__new" href="car-data.html">
                    Новый расчет
                    <svg class="saved__plus" viewBox="0 0 22 22" aria-hidden="true">
                        <path d="M11 0V22M0 11H22" fill="none" stroke="currentColor" stroke-width="3"/>
                    </svg>
                </a>
            </section>

            <a class="cabinet__logout" href="login.html" data-logout>Выйти из аккаунта</a>
        </main>
    </div>

    <script type="module" src="../js/account.js"></script>
</body>
</html>
